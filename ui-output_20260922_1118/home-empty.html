<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I tuoi conti — Finanze di Famiglia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Design Tokens ─────────────────────────────────────── */
    :root {
      --color-primary:        #0066CC;
      --color-primary-dark:   #002244;
      --color-background:     #FFFFFF;
      --color-surface:        #F2F7FC;
      --color-text:           #0E1B26;
      --color-text-muted:     #5A6772;
      --color-border:         #CCD8E0;

      --font-primary: 'Titillium Web', sans-serif;
      --font-serif:   'Lora', serif;

      --size-xs:  0.75rem;   /* 12px */
      --size-sm:  0.875rem;  /* 14px */
      --size-md:  1rem;      /* 16px */
      --size-lg:  1.25rem;   /* 20px */
      --size-xl:  1.5rem;    /* 24px */
      --size-2xl: 2rem;      /* 32px */

      --spacing-xs:  0.25rem;
      --spacing-sm:  0.5rem;
      --spacing-md:  1rem;
      --spacing-lg:  1.5rem;
      --spacing-xl:  2rem;
      --spacing-2xl: 48px;

      --border-radius-sm: 4px;
      --border-radius-md: 8px;

      --nav-height: 64px;
      --page-max-width: 800px;
    }

    /* ── Reset & Base ──────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--size-md);
      color: var(--color-text);
      background-color: var(--color-background);
      line-height: 1.5;
    }

    /* ── Page Layout ───────────────────────────────────────── */
    .page-wrapper {
      max-width: var(--page-max-width);
      margin: 0 auto;
      background-color: var(--color-surface);
      min-height: 100vh;
      padding-bottom: var(--nav-height);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ────────────────────────────────────────────── */
    .site-header {
      background-color: var(--color-primary-dark);
      padding: var(--spacing-md) var(--spacing-xl);
    }

    .site-header__title {
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: var(--size-xl);
      color: var(--color-background);
      line-height: 1.2;
    }

    /* ── Main ──────────────────────────────────────────────── */
    .site-main {
      flex: 1;
      padding: var(--spacing-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Empty State ───────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--spacing-2xl) var(--spacing-md);
      width: 100%;
    }

    .empty-state__illustration {
      display: block;
      width: 96px;
      height: 96px;
      margin-bottom: var(--spacing-xl);
      color: var(--color-border);
    }

    .empty-state__title {
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: var(--size-lg);
      color: var(--color-text);
      margin-bottom: var(--spacing-sm);
    }

    .empty-state__subtitle {
      font-family: var(--font-primary);
      font-weight: 400;
      font-size: var(--size-md);
      color: var(--color-text-muted);
      max-width: 320px;
      margin-bottom: 0;
    }

    /* ── Primary Button ────────────────────────────────────── */
    .btn-primary {
      display: block;
      margin: var(--spacing-lg) auto 0;
      padding: var(--spacing-sm) var(--spacing-xl);
      background-color: var(--color-primary);
      color: var(--color-background);
      font-family: var(--font-primary);
      font-weight: 600;
      font-size: var(--size-md);
      text-decoration: none;
      border-radius: var(--border-radius-sm);
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover,
    .btn-primary:focus-visible {
      background-color: var(--color-primary-dark);
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* ── Bottom Navigation ─────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--page-max-width);
      height: var(--nav-height);
      background-color: var(--color-background);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: stretch;
    }

    .bottom-nav__item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-xs);
      text-decoration: none;
      color: var(--color-text-muted);
      font-family: var(--font-primary);
      font-size: var(--size-xs);
      font-weight: 600;
      padding: var(--spacing-xs) var(--spacing-md);
      border-top: 3px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .bottom-nav__item--active {
      color: var(--color-primary);
      border-top-color: var(--color-primary);
    }

    .bottom-nav__item:hover:not(.bottom-nav__item--active) {
      color: var(--color-text);
    }

    .bottom-nav__icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* ── Responsive ────────────────────────────────────────── */
    @media (min-width: 768px) {
      .site-header {
        padding: var(--spacing-lg) var(--spacing-2xl);
      }

      .site-main {
        padding: var(--spacing-xl);
      }

      .empty-state {
        padding: var(--spacing-2xl) var(--spacing-xl);
      }
    }

    @media (min-width: 1024px) {
      .page { max-width: 900px; }
    }
    @media (min-width: 1280px) {
      .page { max-width: 1024px; }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <!-- ── Header ─────────────────────────────────────── -->
    <header class="site-header" role="banner">
      <h1 class="site-header__title">I tuoi conti</h1>
    </header>

    <!-- ── Main Content ───────────────────────────────── -->
    <main class="site-main" id="main-content">

      <section class="empty-state" aria-labelledby="empty-title">

        <!-- Wallet / Piggy Bank SVG Illustration -->
        <svg
          class="empty-state__illustration"
          viewBox="0 0 96 96"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <!-- Piggy bank body -->
          <ellipse cx="46" cy="56" rx="28" ry="24" fill="currentColor" opacity="0.25" />
          <ellipse cx="46" cy="56" rx="28" ry="24" stroke="currentColor" stroke-width="3.5" fill="none" />

          <!-- Head -->
          <circle cx="22" cy="44" r="11" fill="currentColor" opacity="0.25" />
          <circle cx="22" cy="44" r="11" stroke="currentColor" stroke-width="3.5" fill="none" />

          <!-- Snout -->
          <ellipse cx="16" cy="48" rx="5" ry="3.5" fill="none" stroke="currentColor" stroke-width="2.5" />
          <!-- Nostrils -->
          <circle cx="14.5" cy="48" r="1" fill="currentColor" />
          <circle cx="17.5" cy="48" r="1" fill="currentColor" />

          <!-- Ear -->
          <ellipse cx="26" cy="35" rx="4" ry="5.5" fill="currentColor" opacity="0.3" />
          <ellipse cx="26" cy="35" rx="4" ry="5.5" stroke="currentColor" stroke-width="2.5" fill="none" />

          <!-- Eye -->
          <circle cx="20" cy="40" r="1.5" fill="currentColor" />

          <!-- Coin slot -->
          <rect x="36" y="33" width="14" height="3" rx="1.5" fill="currentColor" />

          <!-- Legs -->
          <rect x="30" y="77" width="6" height="10" rx="3" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="2.5" />
          <rect x="40" y="77" width="6" height="10" rx="3" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="2.5" />
          <rect x="52" y="77" width="6" height="10" rx="3" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="2.5" />
          <rect x="62" y="77" width="6" height="10" rx="3" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="2.5" />

          <!-- Tail -->
          <path d="M74 52 Q84 46 80 56 Q76 66 84 62" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" />

          <!-- Coin -->
          <circle cx="74" cy="28" r="9" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2.5" />
          <text x="74" y="33" text-anchor="middle" font-size="11" font-family="sans-serif" fill="currentColor" font-weight="700">€</text>
        </svg>

        <h2 class="empty-state__title" id="empty-title">
          Non hai ancora nessun conto
        </h2>

        <p class="empty-state__subtitle">
          Crea il tuo primo conto per iniziare a tracciare le spese
        </p>

        <a href="nuovo-conto.html" class="btn-primary">
          Crea il tuo primo conto
        </a>

      </section>

    </main>

  </div><!-- /.page-wrapper -->

  <!-- ── Bottom Navigation ───────────────────────────── -->
  <nav class="bottom-nav" aria-label="Navigazione principale">

    <a href="dashboard.html" class="bottom-nav__item" aria-label="Dashboard">
      <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8" />
      </svg>
      Dashboard
    </a>

    <a href="home.html" class="bottom-nav__item bottom-nav__item--active" aria-label="Conti" aria-current="page">
      <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <rect x="2" y="7" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
        <path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.8" />
        <circle cx="12" cy="14" r="2.5" stroke="currentColor" stroke-width="1.8" />
        <path d="M6 14h1.5M16.5 14H18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      Conti
    </a>

  </nav>

</body>
</html>
