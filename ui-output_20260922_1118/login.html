<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Finanze di Famiglia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Lora:wght@400&display=swap" rel="stylesheet">
  <style>
    /* SEZIONE 1 — Design Tokens */
    :root {
      /* Palette */
      --color-primary: #0066CC;
      --color-primary-dark: #002244;
      --color-primary-hover: #004D99;
      --color-background: #FFFFFF;
      --color-surface: #F2F7FC;
      --color-text: #0E1B26;
      --color-text-muted: #5A6772;
      --color-border: #CCD8E0;
      --color-error: #D32F2F;
      --color-success: #2E7D32;
      --color-white: #FFFFFF;

      /* Typography */
      --font-primary: 'Titillium Web', sans-serif;
      --font-secondary: 'Lora', serif;

      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-md: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.5rem;

      --font-weight-regular: 400;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;

      --line-height-base: 1.5;
      --line-height-heading: 1.2;

      /* Spacing */
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --spacing-xxl: 3rem;

      /* Border */
      --border-radius-sm: 4px;
      --border-radius-md: 8px;
      --border-radius-lg: 16px;
      --border-width: 1px;

      /* Shadow */
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.08);

      /* Layout */
      --max-width-page: 1280px;
      --max-width-card: 400px;

      /* Transition */
      --transition-base: 0.2s ease;

      /* Focus */
      --focus-outline-width: 2px;
      --focus-outline-offset: 2px;
    }

    /* SEZIONE 2 — Reset e Base */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-primary);
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-base);
      color: var(--color-text);
      background-color: var(--color-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    a {
      color: var(--color-primary);
      text-decoration: underline;
    }

    a:hover,
    a:focus {
      color: var(--color-primary-hover);
    }

    /* SEZIONE 3 — Componenti (solo var(--...)) */

    /* --- Page Layout --- */
    .page-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* --- Header Istituzionale --- */
    .site-header {
      background-color: var(--color-primary-dark);
      padding: var(--spacing-md) var(--spacing-xl);
    }

    .site-header__inner {
      max-width: var(--max-width-page);
      margin: 0 auto;
    }

    .site-header__title {
      font-family: var(--font-primary);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-xl);
      line-height: var(--line-height-heading);
      color: var(--color-white);
      margin-bottom: var(--spacing-xs);
    }

    .site-header__subtitle {
      font-family: var(--font-primary);
      font-weight: var(--font-weight-regular);
      font-size: var(--font-size-sm);
      color: var(--color-white);
    }

    /* --- Main --- */
    .site-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-xl);
    }

    /* --- Login Card --- */
    .login-card {
      background-color: var(--color-background);
      border-radius: var(--border-radius-lg);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-card);
      width: 100%;
      max-width: var(--max-width-card);
    }

    .login-card__heading {
      font-family: var(--font-primary);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-lg);
      color: var(--color-text);
      margin-bottom: var(--spacing-lg);
      text-align: center;
    }

    /* --- Form --- */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      margin-bottom: var(--spacing-lg);
    }

    .form-label {
      font-family: var(--font-primary);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-sm);
      color: var(--color-text);
    }

    .form-input {
      font-family: var(--font-primary);
      font-size: var(--font-size-md);
      color: var(--color-text);
      background-color: var(--color-background);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--border-radius-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      width: 100%;
      transition: border-color var(--transition-base), outline-color var(--transition-base);
      outline: var(--focus-outline-width) solid transparent;
      outline-offset: var(--focus-outline-offset);
    }

    .form-input::placeholder {
      color: var(--color-text-muted);
    }

    .form-input:focus {
      border-color: var(--color-primary);
      outline-color: var(--color-primary);
    }

    /* --- Button --- */
    .btn-primary {
      display: block;
      width: 100%;
      font-family: var(--font-primary);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-md);
      color: var(--color-white);
      background-color: var(--color-primary);
      border: none;
      border-radius: var(--border-radius-sm);
      padding: var(--spacing-sm) var(--spacing-xl);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color var(--transition-base);
    }

    .btn-primary:hover,
    .btn-primary:focus {
      background-color: var(--color-primary-hover);
      color: var(--color-white);
      outline: var(--focus-outline-width) solid var(--color-primary);
      outline-offset: var(--focus-outline-offset);
    }

    /* --- Footer --- */
    .site-footer {
      padding: var(--spacing-md) var(--spacing-xl);
      text-align: center;
    }

    .site-footer__text {
      font-family: var(--font-primary);
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }

    /* SEZIONE 4 — Media Query */

    /* XS: 375px */
    @media (max-width: 374px) {
      .site-header {
        padding: var(--spacing-sm) var(--spacing-md);
      }

      .site-main {
        padding: var(--spacing-md);
      }

      .login-card {
        padding: var(--spacing-lg);
      }

      .site-header__title {
        font-size: var(--font-size-lg);
      }
    }

    /* SM: 768px */
    @media (min-width: 768px) {
      .site-header {
        padding: var(--spacing-lg) var(--spacing-xl);
      }

      .site-main {
        padding: var(--spacing-xxl) var(--spacing-xl);
      }

      .login-card {
        padding: var(--spacing-xxl);
      }
    }

    /* MD: 1024px */
    @media (min-width: 1024px) {
      .site-header__inner {
        display: flex;
        align-items: baseline;
        gap: var(--spacing-md);
      }

      .site-header__title {
        margin-bottom: 0;
      }
    }

    /* LG: 1280px */
    @media (min-width: 1280px) {
      .site-header {
        padding: var(--spacing-lg) var(--spacing-xxl);
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <header class="site-header">
      <div class="site-header__inner">
        <h1 class="site-header__title">Finanze di famiglia</h1>
        <p class="site-header__subtitle">Gestisci le spese della tua famiglia</p>
      </div>
    </header>

    <main class="site-main">
      <div class="login-card">
        <h2 class="login-card__heading">Accedi</h2>
        <form id="login-form" action="dashboard.html" method="get">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              placeholder="Inserisci la password"
              autocomplete="current-password"
              required
            >
          </div>
          <button class="btn-primary" type="submit">Accedi</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <p class="site-footer__text">Accesso locale — i dati restano nel tuo browser</p>
    </footer>

  </div>
</body>
</html>
