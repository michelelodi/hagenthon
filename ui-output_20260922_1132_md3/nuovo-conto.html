<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuovo conto — Finanze di Famiglia</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="storage.js"></script>
  <script>if (!isLoggedIn()) window.location.replace('login.html');</script>
  <style>
    :root {
      --md-primary: #0061A4;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #D1E4FF;
      --md-on-primary-container: #001D36;
      --md-surface: #FDFCFF;
      --md-surface-variant: #DFE2EB;
      --md-on-surface: #1A1C1E;
      --md-on-surface-variant: #43474E;
      --md-outline: #73777F;
      --md-outline-variant: #C3C7CF;
      --md-error: #BA1A1A;
      --font: 'Roboto', sans-serif;
      --shape-xs: 4px;
      --shape-sm: 8px;
      --shape-md: 12px;
      --shape-lg: 16px;
      --shape-xl: 28px;
      --shape-full: 50%;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;
      --elevation-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background: var(--md-surface);
      color: var(--md-on-surface);
      min-height: 100vh;
    }

    .page-wrapper {
      max-width: 560px;
      margin: 0 auto;
    }

    /* MD3 Top App Bar — Small */
    .top-app-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--spacing-xs) 0 var(--spacing-xs);
      gap: var(--spacing-xs);
      background: var(--md-surface);
    }

    .top-app-bar__nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--shape-full);
      color: var(--md-on-surface);
      text-decoration: none;
      flex-shrink: 0;
      transition: background 200ms;
    }

    .top-app-bar__nav-icon:hover {
      background: rgba(26, 28, 30, 0.08);
    }

    .top-app-bar__nav-icon:active {
      background: rgba(26, 28, 30, 0.12);
    }

    .top-app-bar__title {
      font-size: 22px;
      font-weight: 400;
      line-height: 28px;
      color: var(--md-on-surface);
      flex: 1;
    }

    .material-symbols-outlined {
      font-size: 24px;
      line-height: 1;
      user-select: none;
    }

    /* Main content */
    .main-content {
      padding: var(--spacing-md);
    }

    /* MD3 Outlined Text Field */
    .text-field {
      position: relative;
      width: 100%;
    }

    .text-field + .text-field {
      margin-top: var(--spacing-lg);
    }

    .text-field__container {
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid var(--md-outline);
      border-radius: var(--shape-xs);
      background: transparent;
      transition: border-color 200ms, border-width 200ms;
    }

    .text-field__container:focus-within {
      border: 2px solid var(--md-primary);
    }

    .text-field__leading-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 56px;
      flex-shrink: 0;
      color: var(--md-on-surface-variant);
      pointer-events: none;
    }

    .text-field__container:focus-within .text-field__leading-icon {
      color: var(--md-primary);
    }

    .text-field__input-wrapper {
      position: relative;
      flex: 1;
      height: 56px;
    }

    .text-field__input-wrapper--no-icon {
      padding-left: 12px;
    }

    .text-field__label {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      font-weight: 400;
      color: var(--md-on-surface-variant);
      pointer-events: none;
      transition: top 150ms, font-size 150ms, color 150ms, transform 150ms;
      background: var(--md-surface);
      padding: 0 4px;
      white-space: nowrap;
    }

    .text-field__input {
      width: 100%;
      height: 100%;
      padding: 16px 12px 16px 0;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 400;
      color: var(--md-on-surface);
      background: transparent;
      border: none;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    /* Il placeholder appare solo quando il campo è a fuoco (la label è già salita),
       così non si sovrappone alla label centrata a riposo. */
    .text-field__input::placeholder {
      color: transparent;
    }

    .text-field__container:focus-within .text-field__input::placeholder {
      color: var(--md-on-surface-variant);
    }

    .text-field__input-wrapper--no-icon .text-field__input {
      padding-left: 0;
    }

    /* Floating label — focus or filled */
    .text-field__container:focus-within .text-field__label,
    .text-field--filled .text-field__label {
      top: 0;
      transform: translateY(-50%);
      font-size: 12px;
      color: var(--md-primary);
    }

    .text-field--filled:not(:focus-within) .text-field__label {
      color: var(--md-on-surface-variant);
    }

    /* Remove number input spinners */
    .text-field__input[type=number]::-webkit-inner-spin-button,
    .text-field__input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .text-field__input[type=number] {
      -moz-appearance: textfield;
    }

    /* Action row */
    .action-row {
      display: flex;
      gap: var(--spacing-sm);
      justify-content: flex-end;
      margin-top: var(--spacing-xl);
    }

    /* MD3 Text Button */
    .btn-text {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1px;
      color: var(--md-primary);
      background: transparent;
      border: none;
      border-radius: var(--shape-full);
      padding: 10px 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background 200ms;
      min-width: 48px;
      height: 40px;
    }

    .btn-text:hover {
      background: rgba(0, 97, 164, 0.08);
    }

    .btn-text:active {
      background: rgba(0, 97, 164, 0.12);
    }

    /* MD3 Filled Button */
    .btn-filled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1px;
      color: var(--md-on-primary);
      background: var(--md-primary);
      border: none;
      border-radius: var(--shape-full);
      padding: 10px 24px;
      cursor: pointer;
      text-decoration: none;
      transition: box-shadow 200ms, filter 200ms;
      height: 40px;
      box-shadow: var(--elevation-1);
    }

    .btn-filled:hover {
      filter: brightness(1.08);
      box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15);
    }

    .btn-filled:active {
      filter: brightness(0.92);
      box-shadow: none;
    }

    /* Responsive — tablet/desktop */
    @media (min-width: 600px) {
      .page-wrapper {
        padding-top: var(--spacing-xl);
      }

      .main-content {
        box-shadow: var(--elevation-1);
        border-radius: var(--shape-xl);
        background: var(--md-surface);
        margin: 0 var(--spacing-md) var(--spacing-xl);
      }

      .top-app-bar {
        border-radius: var(--shape-xl) var(--shape-xl) 0 0;
      }
    }
  
    @media (min-width: 840px) {
      .page-wrapper { max-width: 840px; }
    }
    @media (min-width: 1240px) {
      .page-wrapper { max-width: 1024px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <!-- MD3 Top App Bar — Small -->
    <header class="top-app-bar">
      <a href="home.html" class="top-app-bar__nav-icon" aria-label="Torna indietro">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <h1 class="top-app-bar__title">Nuovo conto</h1>
    </header>

    <!-- Main content -->
    <main class="main-content">

      <!-- Field 1: Nome conto -->
      <div class="text-field" id="field-nome">
        <div class="text-field__container">
          <div class="text-field__input-wrapper text-field__input-wrapper--no-icon">
            <label class="text-field__label" for="input-nome">Nome conto</label>
            <input
              class="text-field__input"
              type="text"
              id="input-nome"
              name="nome-conto"
              placeholder="es. Conto familiare"
              autocomplete="off"
            />
          </div>
        </div>
      </div>

      <!-- Field 2: Saldo iniziale -->
      <div class="text-field" id="field-saldo">
        <div class="text-field__container">
          <div class="text-field__leading-icon" aria-hidden="true">
            <span class="material-symbols-outlined">euro</span>
          </div>
          <div class="text-field__input-wrapper">
            <label class="text-field__label" for="input-saldo">Saldo iniziale (€)</label>
            <input
              class="text-field__input"
              type="number"
              id="input-saldo"
              name="saldo-iniziale"
              min="0"
              step="0.01"
            />
          </div>
        </div>
      </div>

      <!-- Messaggio di errore inline -->
      <p id="form-error" role="alert" hidden
         style="color:var(--md-error);font-size:12px;margin-top:var(--spacing-sm);"></p>

      <!-- Action row -->
      <div class="action-row">
        <a href="home.html" class="btn-text">Annulla</a>
        <button class="btn-filled" type="button" id="btn-crea">Crea conto</button>
      </div>

    </main>
  </div>

  <script>
    // ── Creazione conto (ticket 03) ──
    (function () {
      var inputNome = document.getElementById('input-nome');
      var inputSaldo = document.getElementById('input-saldo');
      var error = document.getElementById('form-error');

      function mostraErrore(msg) {
        error.textContent = msg;
        error.hidden = false;
      }

      document.getElementById('btn-crea').addEventListener('click', function () {
        error.hidden = true;
        var nome = inputNome.value.trim();
        var saldoRaw = inputSaldo.value.trim();

        if (!nome) {
          mostraErrore('Inserisci un nome per il conto.');
          inputNome.focus();
          return;
        }
        var saldo = Number(saldoRaw);
        if (saldoRaw === '' || isNaN(saldo)) {
          mostraErrore('Inserisci un saldo iniziale valido.');
          inputSaldo.focus();
          return;
        }

        var conto = createConto({ nome: nome, saldoIniziale: saldo });
        window.location.href = 'dettaglio-conto.html?id=' + encodeURIComponent(conto.id);
      });
    })();

    // Floating label — mark field as filled when input has value
    function syncFilledState(inputEl, fieldEl) {
      if (inputEl.value.length > 0) {
        fieldEl.classList.add('text-field--filled');
      } else {
        fieldEl.classList.remove('text-field--filled');
      }
    }

    document.querySelectorAll('.text-field__input').forEach(function(input) {
      var field = input.closest('.text-field');
      input.addEventListener('input', function() {
        syncFilledState(input, field);
      });
      input.addEventListener('blur', function() {
        syncFilledState(input, field);
      });
      // Init state (e.g. autofill)
      syncFilledState(input, field);
    });
  </script>
</body>
</html>
