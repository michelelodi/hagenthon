<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I tuoi conti — Finanze di Famiglia</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    :root {
      --md-primary: #0061A4;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #D1E4FF;
      --md-on-primary-container: #001D36;
      --md-surface: #FDFCFF;
      --md-surface-variant: #DFE2EB;
      --md-on-surface: #1A1C1E;
      --md-on-surface-variant: #43474E;
      --md-outline: #73777F;
      --md-outline-variant: #C3C7CF;
      --font: 'Roboto', sans-serif;
      --shape-xs: 4px;
      --shape-sm: 8px;
      --shape-md: 12px;
      --shape-lg: 16px;
      --shape-xl: 28px;
      --shape-full: 50%;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;
      --elevation-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
      --nav-bar-height: 80px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--md-surface);
      color: var(--md-on-surface);
      min-height: 100vh;
      padding-bottom: var(--nav-bar-height);
    }

    /* ── MD3 Top App Bar (Small) ── */
    .top-app-bar {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--spacing-md);
      background-color: var(--md-surface);
    }

    .top-app-bar__title {
      font-family: var(--font);
      font-weight: 400;
      font-size: 22px;
      color: var(--md-on-surface);
      line-height: 28px;
    }

    /* ── Main content ── */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: var(--spacing-2xl);
      padding-left: var(--spacing-md);
      padding-right: var(--spacing-md);
    }

    /* ── MD3 Empty State ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .empty-state__icon {
      font-family: 'Material Symbols Outlined';
      font-size: 80px;
      color: var(--md-outline);
      line-height: 1;
      font-weight: 400;
      font-style: normal;
      letter-spacing: normal;
      text-transform: none;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    .empty-state__headline {
      font-family: var(--font);
      font-weight: 400;
      font-size: 24px;
      color: var(--md-on-surface);
      line-height: 32px;
      margin-top: var(--spacing-md);
    }

    .empty-state__body {
      font-family: var(--font);
      font-weight: 400;
      font-size: 14px;
      color: var(--md-on-surface-variant);
      line-height: 20px;
      max-width: 280px;
      margin-top: var(--spacing-sm);
    }

    /* ── MD3 Filled Button ── */
    .btn-filled {
      display: inline-block;
      background-color: var(--md-primary);
      color: var(--md-on-primary);
      font-family: var(--font);
      font-weight: 500;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.1px;
      text-decoration: none;
      border-radius: var(--shape-full);
      padding: 10px 24px;
      margin-top: var(--spacing-lg);
      border: none;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }

    .btn-filled:hover {
      box-shadow: var(--elevation-1);
    }

    /* ── MD3 Navigation Bar (fixed bottom) ── */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-bar-height);
      background-color: var(--md-surface-variant);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 var(--spacing-md);
    }

    .nav-bar__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-xs);
      text-decoration: none;
      flex: 1;
      padding: var(--spacing-sm) 0;
    }

    .nav-bar__indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 32px;
      border-radius: var(--shape-full);
    }

    .nav-bar__item--active .nav-bar__indicator {
      background-color: var(--md-primary-container);
    }

    .nav-bar__icon {
      font-family: 'Material Symbols Outlined';
      font-size: 24px;
      font-weight: 400;
      font-style: normal;
      letter-spacing: normal;
      text-transform: none;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      color: var(--md-on-surface-variant);
    }

    .nav-bar__item--active .nav-bar__icon {
      color: var(--md-on-primary-container);
    }

    .nav-bar__label {
      font-family: var(--font);
      font-weight: 500;
      font-size: 12px;
      line-height: 16px;
      color: var(--md-on-surface-variant);
    }

    .nav-bar__item--active .nav-bar__label {
      color: var(--md-on-primary-container);
    }
  </style>
</head>
<body>

  <!-- MD3 Top App Bar (Small) -->
  <header class="top-app-bar">
    <h1 class="top-app-bar__title">I tuoi conti</h1>
  </header>

  <!-- Main content — Empty State -->
  <main class="main-content">
    <div class="empty-state">
      <span class="empty-state__icon material-symbols-outlined">account_balance_wallet</span>
      <p class="empty-state__headline">Non hai ancora nessun conto</p>
      <p class="empty-state__body">Crea il tuo primo conto per iniziare a tracciare le spese</p>
      <a href="nuovo-conto.html" class="btn-filled">Crea il tuo primo conto</a>
    </div>
  </main>

  <!-- MD3 Navigation Bar (fixed bottom) -->
  <nav class="nav-bar">
    <a href="dashboard.html" class="nav-bar__item">
      <div class="nav-bar__indicator">
        <span class="nav-bar__icon material-symbols-outlined">bar_chart</span>
      </div>
      <span class="nav-bar__label">Dashboard</span>
    </a>
    <a href="home.html" class="nav-bar__item nav-bar__item--active">
      <div class="nav-bar__indicator">
        <span class="nav-bar__icon material-symbols-outlined">account_balance_wallet</span>
      </div>
      <span class="nav-bar__label">Conti</span>
    </a>
  </nav>

</body>
</html>
