<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanze di Famiglia — Accedi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    :root {
      --md-primary: #0061A4;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #D1E4FF;
      --md-on-primary-container: #001D36;
      --md-secondary: #535F70;
      --md-surface: #FDFCFF;
      --md-surface-variant: #DFE2EB;
      --md-on-surface: #1A1C1E;
      --md-on-surface-variant: #43474E;
      --md-outline: #73777F;
      --md-outline-variant: #C3C7CF;
      --md-error: #BA1A1A;
      --md-inverse-surface: #2F3033;
      --md-inverse-on-surface: #F1F0F4;
      --md-scrim: rgba(0,0,0,0.32);

      --font: 'Roboto', sans-serif;

      --shape-xs: 4px;
      --shape-sm: 8px;
      --shape-md: 12px;
      --shape-lg: 16px;
      --shape-xl: 28px;
      --shape-full: 50%;

      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;

      --elevation-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
      --elevation-2: 0 1px 2px rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--md-surface);
      color: var(--md-on-surface);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-top: 10vh;
      padding-left: var(--spacing-md);
      padding-right: var(--spacing-md);
    }

    .page-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── App header area ── */
    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: var(--spacing-xl);
      text-align: center;
    }

    .app-icon {
      font-size: 56px;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
      color: var(--md-primary);
      line-height: 1;
      margin-bottom: var(--spacing-md);
    }

    .app-name {
      font-family: var(--font);
      font-weight: 400;
      font-size: 28px;
      color: var(--md-on-surface);
      margin-bottom: var(--spacing-sm);
    }

    .app-subtitle {
      font-family: var(--font);
      font-weight: 400;
      font-size: 14px;
      color: var(--md-on-surface-variant);
    }

    /* ── MD3 Outlined Card ── */
    .login-card {
      width: 100%;
      background-color: var(--md-surface);
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--shape-xl);
      padding: var(--spacing-xl);
      box-shadow: var(--elevation-1);
    }

    /* ── MD3 Outlined TextField ── */
    .text-field {
      position: relative;
      width: 100%;
      margin-bottom: var(--spacing-lg);
    }

    .text-field__input {
      width: 100%;
      height: 56px;
      padding: 16px 12px;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 400;
      color: var(--md-on-surface);
      background-color: transparent;
      border: 1px solid var(--md-outline);
      border-radius: var(--shape-xs);
      outline: none;
      transition: border-color 0.2s, border-width 0.2s;
    }

    .text-field__input:focus {
      border: 2px solid var(--md-primary);
    }

    .text-field__label {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      font-family: var(--font);
      font-size: 16px;
      font-weight: 400;
      color: var(--md-on-surface-variant);
      background-color: var(--md-surface);
      padding: 0 4px;
      pointer-events: none;
      transition: top 0.15s ease, font-size 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .text-field__input:focus + .text-field__label,
    .text-field__input:not(:placeholder-shown) + .text-field__label {
      top: 0;
      transform: translateY(-50%);
      font-size: 12px;
      color: var(--md-primary);
    }

    .text-field__input:not(:focus):not(:placeholder-shown) + .text-field__label {
      color: var(--md-on-surface-variant);
    }

    /* ── MD3 Filled Button ── */
    .btn-filled {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 40px;
      padding: 10px 24px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1px;
      color: var(--md-on-primary);
      background-color: var(--md-primary);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      overflow: hidden;
      text-decoration: none;
      transition: box-shadow 0.2s;
    }

    .btn-filled::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: transparent;
      border-radius: inherit;
      transition: background-color 0.15s;
    }

    .btn-filled:hover::after {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .btn-filled:active::after {
      background-color: rgba(255, 255, 255, 0.12);
    }

    .btn-filled:hover {
      box-shadow: var(--elevation-1);
    }

    /* ── Body Medium note ── */
    .login-note {
      font-family: var(--font);
      font-weight: 400;
      font-size: 12px;
      color: var(--md-on-surface-variant);
      text-align: center;
      margin-top: var(--spacing-md);
    }

    /* ── Responsive ── */
    @media (min-width: 600px) {
      .page-wrapper {
        max-width: 440px;
      }
    }

    @media (min-width: 840px) {
      body {
        padding-top: 10vh;
        padding-left: var(--spacing-2xl);
        padding-right: var(--spacing-2xl);
      }

      .page-wrapper {
        max-width: 440px;
      }
    }
  
    @media (min-width: 1240px) {
      .page-wrapper { max-width: 1024px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <!-- App header area -->
    <header class="app-header">
      <span class="material-symbols-outlined app-icon">account_balance_wallet</span>
      <h1 class="app-name">Finanze di Famiglia</h1>
      <p class="app-subtitle">Gestisci le spese della tua famiglia</p>
    </header>

    <!-- MD3 Outlined Card -->
    <div class="login-card">
      <form action="dashboard.html" method="get">

        <!-- MD3 Outlined TextField: Password -->
        <div class="text-field">
          <input
            class="text-field__input"
            type="password"
            id="password"
            name="password"
            placeholder=" "
            autocomplete="current-password"
          />
          <label class="text-field__label" for="password">Password</label>
        </div>

        <!-- MD3 Filled Button -->
        <button class="btn-filled" type="submit">Accedi</button>

      </form>
    </div>

    <!-- Body Medium note -->
    <p class="login-note">Accesso locale · i dati restano nel tuo browser</p>

  </div>
</body>
</html>
